:root {
  --sb: 0px;
  --rg: #155240; --rg2: #49ac57; --rg3: #9fcfa7; --ro: #f26529; --ro2: #b23a0e; --ink: #2f3133; --mut: #5b6268; --line: #dbe3dd;
  --bg: #eef4f0; --tint: #dcefe0; --chat: #efeae2;
  --match-bg: #e1f2e5; --match-ink: #11492f; --match-edge: #3f9a50;
  --look-bg: #e7eefb; --look-ink: #1f3266; --look-edge: #4a6bbf;
  --sys: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  --display: Georgia, 'Times New Roman', serif;
  color-scheme: light dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { background: #d7e3db; font-family: var(--sys); color: var(--ink); display: flex; justify-content: center; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: inherit; }
svg { width: 20px; height: 20px; flex-shrink: 0; }
#app { position: relative; width: 100%; max-width: 480px; height: 100dvh; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 40px rgba(0,0,0,.1); }
.muted { color: var(--mut); font-size: 14.5px; line-height: 1.5; }
.h2 { font-family: var(--display); font-size: 24px; font-weight: 700; color: var(--rg); }
.pad { padding: 16px 14px 28px; display: flex; flex-direction: column; gap: 10px; }
.hint { font-size: 13px; color: var(--mut); font-weight: 700; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; font-size: 16px; border-radius: 999px; padding: 13px 18px; text-align: center; width: 100%; }
.btn.go { background: #b23a0e; color: #fff; }
.btn.go:active { background: #8f2f0b; }
.btn.off { background: #e2e6e3; color: #6d7378; }
.btn.ghost { background: #fff; color: var(--rg); border: 2px solid var(--rg); }
.btn.small { width: auto; padding: 8px 16px; font-size: 14px; background: #fff; color: var(--look-ink); border: 2px solid var(--look-edge); }

/* splash (shared kit) */
#app.v-splash { background: radial-gradient(circle at 50% 30%, #1f6e55, #0f3d30 70%); color: #fff; align-items: center; justify-content: center; }
.v-splash .rk-btn.primary { background: #c8420a; }

/* header */
.hd { background: var(--rg); color: #fff; padding: 10px 14px 12px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; }
.hd-1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.hd-brand { font-family: var(--display); letter-spacing: .18em; font-size: 14px; color: #d6eedb; }
.hd-pills { display: flex; gap: 6px; }
.hd-pills button { font-size: 12.5px; font-weight: 800; padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,.14); color: #fff; }
.hd-pills button.now { background: #c8420a; }
.hd-2 { display: flex; align-items: center; gap: 10px; }
.hd-t { flex: 1; font-family: var(--display); font-size: 22px; } .hd-t.sm { font-family: var(--sys); font-size: 13.5px; font-weight: 700; color: #d6eedb; }
.hd-back { display: inline-flex; align-items: center; gap: 2px; font-weight: 800; font-size: 14px; padding: 5px 10px 5px 6px; border-radius: 999px; background: rgba(255,255,255,.14); }
.hd-score { display: flex; gap: 6px; }
.sc { display: inline-flex; align-items: center; gap: 4px; font-weight: 800; font-size: 14px; padding: 4px 10px; border-radius: 999px; }
.sc.pts { background: #c8420a; color: #fff; } .sc.badges { background: rgba(255,255,255,.14); color: #fff; }
.sc svg { width: 16px; height: 16px; }

/* shell */
.main { flex: 1; overflow-y: auto; }
.nav { display: flex; background: #fff; border-top: 1px solid var(--line); flex-shrink: 0; padding-bottom: env(safe-area-inset-bottom); }
.nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 10px; color: #6d7378; font-weight: 800; font-size: 12.5px; border-top: 3px solid transparent; }
.nav button svg { width: 24px; height: 24px; }
.nav button.on { color: var(--rg); border-top-color: var(--rg2); }

/* map */
.map { padding: 12px 12px 24px; display: flex; flex-direction: column; gap: 10px; }
.intro { display: flex; gap: 10px; align-items: center; background: #fff; border-radius: 14px; padding: 12px 14px; box-shadow: 0 1px 3px rgba(21,82,64,.12); }
.intro > div { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.intro h2 { font-family: var(--display); font-size: 19px; color: var(--rg); font-weight: 700; }
.intro p { font-size: 13.5px; line-height: 1.45; color: var(--mut); }
.intro small { font-size: 12.5px; font-weight: 800; color: var(--rg); align-self: flex-end; }
.prog { height: 7px; background: #e2e9e4; border-radius: 4px; overflow: hidden; } .prog i { display: block; height: 100%; background: var(--rg2); }
.urow { display: grid; grid-template-columns: 76px 1fr; background: #fff; border-radius: 16px; overflow: hidden; box-shadow: 0 1px 3px rgba(21,82,64,.12); border: 2px solid #fff; }
.urow.has-next { border-color: #e9a47f; }
.urow.all { border-color: var(--rg3); }
.u-let { position: relative; background: var(--tint); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px 4px; text-align: center; }
.u-let b { font-family: var(--display); font-size: 30px; color: var(--rg); line-height: 1; }
.u-let small { font-size: 10.5px; font-weight: 800; text-transform: uppercase; color: var(--rg); letter-spacing: .02em; }
.u-let i { position: absolute; top: 4px; right: 4px; color: #c98d00; } .u-let i svg { width: 16px; height: 16px; }
.urow.all .u-let { background: var(--rg); } .urow.all .u-let b, .urow.all .u-let small { color: #fff; } .urow.all .u-let i { color: #ffd34d; }
.urow.has-next .u-let { background: #fde3d6; } .urow.has-next .u-let b, .urow.has-next .u-let small { color: #8f2f0b; }
.u-nodes { display: flex; flex-wrap: wrap; justify-content: space-around; gap: 6px; padding: 10px 6px; }
.rnode { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 100px; text-align: center; }
.rn-c { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 17px; background: #fff; color: var(--rg); border: 3px solid var(--rg3); box-shadow: 0 3px 0 #c9dccd; }
.rnode b { font-size: 13px; line-height: 1.2; color: var(--ink); }
.rnode small { font-size: 12px; font-weight: 700; color: var(--mut); }
.rnode.done .rn-c { background: var(--rg); border-color: var(--rg); color: #fff; box-shadow: 0 3px 0 #0b2e24; }
.rnode.done small { color: var(--rg); }
.rnode.next .rn-c { background: #c8420a; border-color: #c8420a; color: #fff; box-shadow: 0 3px 0 #8f2f0b; animation: pulse 1.8s ease-in-out infinite; }
.rnode.next small { color: #a23409; font-weight: 800; }
.rnode.later { opacity: .7; } .rnode.later .rn-c { border-style: dashed; }
@keyframes pulse { 50% { box-shadow: 0 3px 0 #8f2f0b, 0 0 0 7px rgba(200,66,10,.18); } }
.settings-link { align-self: center; font-size: 13.5px; font-weight: 800; color: var(--rg); text-decoration: underline; padding: 8px; }

.sig-card { display: flex; gap: 12px; background: #fff; border-radius: 14px; padding: 12px 14px; box-shadow: 0 1px 3px rgba(21,82,64,.12); }
.sig-n { width: 30px; height: 30px; border-radius: 50%; background: var(--rg); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 900; flex-shrink: 0; }
.sig-card b { font-size: 15.5px; color: var(--rg); } .sig-card p { font-size: 14px; line-height: 1.45; } .sig-card em { font-size: 13.5px; color: #8f2f0b; font-style: normal; font-weight: 700; }
.sig-card.no { background: #f5f8f6; }
.badge-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.badge { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; background: #fff; border: 2px dashed #c9d3cc; border-radius: 16px; padding: 14px 10px; color: var(--mut); }
.badge > span { width: 58px; height: 58px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; font-family: var(--display); background: #edf1ee; color: #8d968f; }
.badge b { font-size: 14px; color: var(--ink); } .badge small { font-size: 11.5px; }
.badge.on { border: 2px solid var(--rg3); } .badge.on > span { background: var(--rg); color: #fff; box-shadow: 0 0 0 4px #ffd34d; }

/* overlays (guide, plan, help, settings) */
.ov { position: absolute; inset: 0; background: rgba(15,61,48,.55); z-index: 20; display: flex; align-items: flex-end; animation: fade .2s both; }
@keyframes fade { from { opacity: 0; } }
.ov-box { width: 100%; max-height: 92%; background: var(--bg); border-radius: 20px 20px 0 0; display: flex; flex-direction: column; animation: up .25s ease-out both; }
@keyframes up { from { transform: translateY(40%); } }
.ov-h { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.ov-h b { font-family: var(--display); font-size: 20px; color: var(--rg); } .ov-h button { font-weight: 800; color: var(--rg); }
.ov-b { overflow-y: auto; padding: 12px 14px 24px; display: flex; flex-direction: column; gap: 10px; }

/* ---------- reto ---------- */
.v-reto { background: var(--chat); }
.scene { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.contact { display: flex; gap: 10px; align-items: center; background: #fff; padding: 8px 14px; border-bottom: 1px solid var(--line); }
.contact > span { display: flex; flex-direction: column; } .contact b { font-size: 15px; } .contact small { font-size: 12px; color: var(--mut); font-weight: 700; }
.av { width: 36px; height: 36px; border-radius: 50%; color: #fff; font-style: normal; font-weight: 900; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.chat { flex: 1; overflow-y: auto; padding: 12px 12px 40%; display: flex; flex-direction: column; gap: 6px; }
.c-b { max-width: 82%; padding: 8px 11px; border-radius: 4px 12px 12px 12px; background: #fff; font-size: 15px; line-height: 1.4; box-shadow: 0 1px 1px rgba(0,0,0,.08); }
.c-b.out { align-self: flex-end; background: #d9fdd3; border-radius: 12px 4px 12px 12px; }
.c-b.hl { outline: 3px solid #c8420a; outline-offset: 1px; }
.c-tag { align-self: flex-start; font-size: 12px; font-weight: 800; color: #fff; background: #b23a0e; padding: 3px 9px; border-radius: 999px; margin-top: 4px; }
.c-sys { align-self: center; font-size: 12.5px; color: #44505a; background: #fff8e0; padding: 4px 10px; border-radius: 8px; text-align: center; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 22px 22px 0 0; box-shadow: 0 -6px 24px rgba(0,0,0,.14); display: flex; flex-direction: column; transition: height .3s ease; z-index: 5; }
.sheet.h-low { height: 40%; } .sheet.h-mid { height: 62%; } .sheet.h-high { height: 80%; } .sheet.h-full { height: 88%; }
.grab { align-self: center; width: 40px; height: 4px; border-radius: 3px; background: #c9cfcb; margin: 8px 0 2px; }
.sh-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 14px 8px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.sh-k { font-size: 12.5px; font-weight: 800; color: var(--mut); }
.stepbar { display: flex; gap: 4px; flex-wrap: wrap; }
.stepbar span { font-size: 11.5px; font-weight: 800; padding: 4px 8px; border-radius: 999px; background: #eef1ef; color: #5b6268; }
.stepbar span.past { background: var(--tint); color: var(--rg); }
.stepbar span.cur { background: #b23a0e; color: #fff; }
.sh-body { flex: 1; overflow-y: auto; padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.sh-foot { margin-top: auto; padding-top: 6px; display: flex; flex-direction: column; gap: 8px; }

.senal { display: flex; flex-direction: column; gap: 10px; }
.sn-h { display: flex; gap: 10px; align-items: center; }
.sn-k { font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; color: #a23409; }
.senal h2 { font-family: var(--display); font-size: 22px; line-height: 1.25; color: var(--rg); font-weight: 700; }
.senal p, .ejemplo p { font-size: 15.5px; line-height: 1.55; }
.tener { background: #f3f7f4; border-radius: 12px; padding: 10px 12px; } .tener b { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--rg); }
.tener ul { margin-top: 6px; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; font-size: 14px; line-height: 1.45; }
.tener li::marker { color: var(--rg2); }
.ejemplo { display: flex; flex-direction: column; gap: 8px; }
.quote { font-family: var(--display); font-size: 18px; color: var(--rg); }

.g-h { display: flex; flex-direction: column; gap: 3px; }
.g-k { font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: .06em; color: #a23409; }
.g-h b { font-size: 17px; line-height: 1.35; }
.msgcard { background: #f7f9f8; border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.mc-h { display: flex; gap: 10px; align-items: center; } .mc-h > span { display: flex; flex-direction: column; } .mc-h b { font-size: 14px; } .mc-h small { font-size: 12px; color: var(--mut); font-weight: 700; }
.mc-t { font-size: 16px; line-height: 1.5; background: #fff; border-radius: 4px 12px 12px 12px; padding: 9px 12px; box-shadow: 0 1px 1px rgba(0,0,0,.06); }
.voice { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 4px 12px 12px 12px; padding: 8px 12px; }
.play { width: 40px; height: 40px; border-radius: 50%; background: var(--rg); color: #fff; display: flex; align-items: center; justify-content: center; }
.play svg { width: 16px; height: 16px; }
.wave { flex: 1; display: flex; align-items: center; gap: 2px; } .wave i { width: 3px; border-radius: 2px; background: #9aa7a0; }
.voice small { font-size: 12px; color: var(--mut); font-weight: 700; }
.link { align-self: flex-start; color: var(--rg); font-weight: 800; font-size: 13.5px; text-decoration: underline; }
.flag-t { line-height: 2.1; }
.seg { cursor: pointer; border-bottom: 2.5px dotted #8d968f; padding: 2px 1px; border-radius: 4px; }
.seg.on { background: #ffe3cf; border-bottom: 2.5px solid #b23a0e; color: #6e2407; }
.seg.match { background: var(--match-bg); border-bottom: 2.5px solid var(--match-edge); color: var(--match-ink); }
.seg.missed { background: #fff0bf; border-bottom: 2.5px solid #b08300; color: #5b4300; }
.seg.extra { background: var(--look-bg); border-bottom: 2.5px solid var(--look-edge); color: var(--look-ink); }

.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; gap: 10px; align-items: center; background: #fff; border: 2px solid #d4dbd6; border-radius: 14px; padding: 11px 13px; font-size: 15.5px; font-weight: 700; line-height: 1.35; text-align: left; }
.opt > span { flex: 1; display: flex; flex-direction: column; gap: 3px; } .opt small { font-size: 13px; font-weight: 600; color: var(--mut); }
.opt em { font-style: normal; font-weight: 900; color: var(--rg); }
.opt .box { width: 24px; height: 24px; border-radius: 6px; border: 2px solid #aab4ad; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.opt .box svg { width: 16px; height: 16px; color: #fff; }
.opt.sel { border-color: var(--rg); background: #f0f7f2; } .opt.sel .box { background: var(--rg); border-color: var(--rg); }
.opt.match { border-color: var(--match-edge); background: var(--match-bg); color: var(--match-ink); } .opt.match .box { background: var(--match-edge); border-color: var(--match-edge); }
.opt.look { border-color: var(--look-edge); background: var(--look-bg); color: var(--look-ink); } .opt.look .box { border-color: var(--look-edge); }
.opt.look .box svg { color: var(--look-edge); } .opt.look small, .opt.match small { color: inherit; opacity: .85; }
.opt.dim { opacity: .6; } .opt.plain { background: #fafbfa; }
.tag { font-style: normal; font-size: 11px; font-weight: 900; padding: 3px 8px; border-radius: 999px; flex-shrink: 0; }
.tag.m { background: var(--match-edge); color: #fff; } .tag.l { background: var(--look-edge); color: #fff; }

.fill-s { font-size: 19px; line-height: 2; font-weight: 700; background: #f7f9f8; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.slot { display: inline-block; min-width: 86px; border-bottom: 3px solid #8d968f; height: 1.4em; vertical-align: bottom; }
.slot.full { border: 2px solid var(--rg); border-radius: 10px; padding: 0 10px; height: auto; line-height: 1.6; color: var(--rg); background: #fff; }
.slot.match { border-color: var(--match-edge); color: var(--match-ink); background: var(--match-bg); } .slot.look { border-color: var(--look-edge); color: var(--look-ink); background: var(--look-bg); }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tiles.col, .answer-line.col { flex-direction: column; align-items: stretch; }
.tile { background: #fff; border: 2px solid #c9d3cc; border-radius: 12px; padding: 8px 13px; font-weight: 800; font-size: 16px; box-shadow: 0 3px 0 #d4dbd6; }
.tile:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #d4dbd6; }
.tile.ghost { background: #e9eeea; color: transparent; box-shadow: none; border-color: #e9eeea; }
.tile.step { display: flex; gap: 10px; align-items: center; text-align: left; font-size: 15px; }
.tile.step i { width: 24px; height: 24px; border-radius: 50%; background: var(--rg); color: #fff; font-style: normal; font-size: 12.5px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.answer-line { min-height: 58px; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; padding: 8px; border: 2px dashed #c9d3cc; border-radius: 14px; background: #fafcfb; }
.answer-line.match { border: 2px solid var(--match-edge); background: var(--match-bg); } .answer-line.look { border: 2px solid var(--look-edge); background: var(--look-bg); }

.swipe-n { text-align: center; font-weight: 800; color: var(--mut); font-size: 13px; }
.swipe-stage { display: flex; justify-content: center; }
.swipe-card { position: relative; width: 100%; min-height: 170px; background: #fff; border: 2px solid #c9d3cc; border-radius: 20px; box-shadow: 0 5px 0 #d4dbd6; padding: 32px 18px 20px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 16.5px; line-height: 1.45; font-weight: 700; touch-action: pan-y; user-select: none; transition: transform .2s; cursor: grab; }
.swipe-card.drag { transition: none; cursor: grabbing; }
.swipe-card.out-l { transform: translateX(-140%) rotate(-18deg) !important; opacity: 0; transition: all .22s ease-in; }
.swipe-card.out-r { transform: translateX(140%) rotate(18deg) !important; opacity: 0; transition: all .22s ease-in; }
.sw-l, .sw-r { position: absolute; top: 9px; font-size: 11.5px; font-weight: 900; text-transform: uppercase; padding: 3px 8px; border-radius: 8px; background: #f1f4f2; color: #5b6268; }
.sw-l { left: 10px; } .sw-r { right: 10px; }
.swipe-card.hint-l .sw-l, .swipe-card.hint-r .sw-r { background: var(--rg); color: #fff; }
.swipe-btns { display: flex; gap: 8px; }
.btn.side { font-size: 14.5px; padding: 12px 6px; background: #fff; border: 2px solid var(--rg); color: var(--rg); border-radius: 14px; }
.swipe-fb { border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; line-height: 1.45; animation: pop .2s both; }
.swipe-fb.match { background: var(--match-bg); color: var(--match-ink); } .swipe-fb.look { background: var(--look-bg); color: var(--look-ink); }
.swipe-fb b { font-size: 16.5px; } .swipe-fb .btn { align-self: flex-end; }
@keyframes pop { from { transform: scale(.96); opacity: 0; } }

.pairs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pcol { display: flex; flex-direction: column; gap: 8px; }
.ptile { min-height: 60px; background: #fff; border: 2px solid #c9d3cc; border-radius: 12px; padding: 8px; box-shadow: 0 3px 0 #d4dbd6; font-weight: 800; font-size: 13.5px; line-height: 1.3; text-align: center; }
.ptile.sel { border-color: var(--rg); background: #f0f7f2; }
.ptile.matched { border-color: var(--match-edge); background: var(--match-bg); color: var(--match-ink); box-shadow: none; opacity: .75; }
.ptile.nope { border-color: var(--look-edge); background: var(--look-bg); animation: wiggle .35s; }
@keyframes wiggle { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

.msgcard.stop { min-height: 220px; }
.sthread { display: flex; flex-direction: column; gap: 7px; max-height: 38vh; overflow-y: auto; }
.sbub { align-self: flex-start; max-width: 90%; background: #fff; border-radius: 4px 12px 12px 12px; padding: 8px 11px; font-size: 15px; line-height: 1.4; animation: pop .25s both; box-shadow: 0 1px 1px rgba(0,0,0,.06); }
.sbub small { display: block; margin-top: 3px; font-size: 12px; font-weight: 800; color: #a23409; }
.sbub.after { opacity: .6; }
.sbub.typing { display: flex; gap: 4px; padding: 11px; } .sbub.typing i { width: 7px; height: 7px; border-radius: 50%; background: #8d968f; animation: dot 1.2s infinite; }
.sbub.typing i:nth-child(2) { animation-delay: .18s; } .sbub.typing i:nth-child(3) { animation-delay: .36s; }
@keyframes dot { 30% { transform: translateY(-3px); opacity: 1; } 0%, 60%, 100% { opacity: .4; } }
.stop-mark { align-self: center; font-size: 12.5px; font-weight: 800; color: #fff; background: var(--rg); padding: 4px 10px; border-radius: 10px; text-align: center; }
.btn.alto { background: #b23a0e; color: #fff; font-size: 21px; padding: 15px; letter-spacing: .02em; }

.result { margin-top: auto; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; animation: pop .22s both; }
.result.match { background: var(--match-bg); color: var(--match-ink); } .result.look { background: var(--look-bg); color: var(--look-ink); }
.r-h { display: flex; align-items: center; gap: 8px; } .r-h b { flex: 1; font-size: 19px; font-weight: 900; }
.r-pts { font-weight: 900; font-size: 15px; background: #fff; padding: 3px 10px; border-radius: 999px; color: var(--rg); }

    else if (ex.type === 'flag') S.ans = [];
    else if (ex.type === 'swipe') { S.ans = []; S.ui.card = 0; S.ui.flash = null; }
    else if (ex.type === 'pairs') { S.ans = { mistakes: 0 }; S.ui.left = shuffle(range(ex.pairs.length)); S.ui.right = shuffle(range(ex.pairs.length)); S.ui.matched = {}; S.ui.sel = null; S.ui.bad = null; }
    else if (ex.type === 'stop') { S.ans = { stopped: null }; S.ui.shown = 1; }
  }
  function startGame(i) {
    S.step = i;
    prepGame();
    renderReto();
    if (E.current(S.sess).ex.type === 'stop') runStop();
  }

  function renderReto() {
    var m = S.m, w = RET.WHO[m.contact], step = S.step;
    var hl = step === 'ej' && m.ej ? m.ej.idx : -1;
    var chat = m.chat.map(function (c, i) {
      if (c[0] === 'sys') return '<div class="c-sys">' + esc(c[1]) + '</div>';
      var on = i === hl;
      return (on ? '<span class="c-tag">' + esc(m.ej.tag) + '</span>' : '') + '<div class="c-b ' + c[0] + (on ? ' hl' : '') + '">' + esc(c[1]) + '</div>';
    }).join('');
    var num = S.retoId === E.REVIEW_ID ? 'Repaso RADAR' : 'Reto ' + retoNumber(S.retoId) + ' · ' + m.moment;
    var bar = '<div class="stepbar">' + steps().map(function (s) {
      return '<span class="' + (s[0] === step ? 'cur' : isPast(s[0]) ? 'past' : '') + '">' + esc(s[1]) + '</span>';
    }).join('') + '</div>';
    var sheet, cls;
    if (step === 'senal') { cls = 'h-mid'; sheet = senalHTML(m); }
    else if (step === 'ej') { cls = 'h-low'; sheet = ejHTML(m); }
    else if (step === 'fin') { cls = 'h-full'; sheet = finHTML(); }
    else { cls = 'h-high'; sheet = gameHTML(); }
    app().className = 'v-reto';
    app().innerHTML = headerHTML(num) + '<div class="scene"><div class="contact"><i class="av" style="background:' + w[2] + '">' + esc(w[1]) + '</i><span><b>' + esc(w[0]) + '</b><small>' + esc(w[3]) + '</small></span></div>' +
      '<div class="chat" id="chat">' + chat + '</div></div>' +
      '<div class="sheet ' + cls + '"><span class="grab"></span><div class="sh-top"><span class="sh-k">' + esc(m.title) + '</span>' + (step === 'fin' ? '' : bar) + '</div><div class="sh-body" id="sh-body">' + sheet + '</div></div>';
    bindHeader();
    bindReto();
    var c = document.getElementById('chat');
    if (c) { var h = c.querySelector('.hl'); if (h) c.scrollTop = Math.max(0, h.offsetTop - 60); else c.scrollTop = c.scrollHeight; }
  }

  function senalHTML(m) {
    var s = m.senal;
    return '<div class="senal"><div class="sn-h">' + radi('happy', 46) + '<div><span class="sn-k">' + esc(s[0]) + '</span><h2>' + esc(s[1]) + '</h2></div></div><p>' + esc(s[2]) + '</p>' +
      (m.puntos && m.puntos.length ? '<div class="tener"><b>Para tener en cuenta</b><ul>' + m.puntos.map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul></div>' : '') +
      '</div><div class="sh-foot"><button class="btn go" data-act="to-ej">' + (m.ej ? 'Ver un ejemplo' : 'Jugar') + '</button></div>';
  }
  function ejHTML(m) {
    return '<div class="ejemplo"><span class="sn-k">Ejemplo · ' + esc(m.ej.tag) + '</span>' + (m.ej.idx === undefined ? '<p class="quote">' + esc(m.ej.quote) + '</p>' : '') + '<p>' + esc(m.ej.text) + '</p></div>' +
      '<div class="sh-foot"><button class="btn go" data-act="to-game">Jugar</button></div>';
  }

  function kindLabel(t) {
    return { pick: 'Elige', fill: 'Completa la frase', build: 'Arma la frase', flag: 'Toca la frase gancho', swipe: 'Desliza la tarjeta', pairs: 'Une las parejas', multi: 'Marca todo lo que aplica', order: 'Ordena', stop: '¡Alto!', choice: '¿Qué harías?' }[t];
  }

  function gameHTML() {
    var ex = E.current(S.sess).ex, r = S.res;
    var kind = kindLabel(ex.type), same = E.norm(ex.prompt).indexOf(E.norm(kind).split(' ')[0]) === 0;
    var head = '<div class="g-h">' + (same ? '' : '<span class="g-k">' + esc(kind) + '</span>') + '<b>' + esc(ex.prompt) + '</b></div>';
    var msg = ex.msg && ex.type !== 'flag' ? msgCard(ex.msg, ex.audio) : '';
    var foot;
    if (r) foot = resultHTML(ex, r);
    else if (ex.type === 'swipe' || ex.type === 'pairs' || ex.type === 'stop') foot = '';
    else foot = '<div class="sh-foot"><button class="btn ' + (ready() ? 'go' : 'off') + '" data-act="check" ' + (ready() ? '' : 'disabled') + '>Comprobar</button></div>';
    return head + msg + gameBody(ex) + foot;
  }

  function msgCard(msg, audio) {
    var w = RET.WHO[msg.who];
    var head = '<span class="mc-h"><i class="av" style="background:' + w[2] + '">' + esc(w[1]) + '</i><span><b>' + esc(w[0]) + '</b><small>' + esc(w[3]) + '</small></span></span>';
    if (audio) {
      return '<div class="msgcard">' + head + '<div class="voice"><button class="play" data-act="play" aria-label="Escuchar">' + IC.play + '</button><span class="wave">' + range(22).map(function (i) { return '<i style="height:' + (6 + ((i * 37) % 17)) + 'px"></i>'; }).join('') + '</span><small>0:07</small></div>' +
        '<button class="link" data-act="transcript">' + (S.ui.transcript ? 'Ocultar texto' : 'Ver texto') + '</button>' + (S.ui.transcript ? '<p class="mc-t">' + esc(msg.text) + '</p>' : '') + '</div>';
    }
    return '<div class="msgcard">' + head + '<p class="mc-t">' + esc(msg.text) + '</p></div>';
  }

  function ready() {
    var ex = E.current(S.sess).ex, a = S.ans;
    switch (ex.type) {
      case 'pick': case 'fill': case 'choice': return a !== null;
      case 'multi': return Object.keys(a).some(function (k) { return a[k]; });
      case 'build': return a.length > 0;
      case 'order': return a.length === ex.steps.length;
      case 'flag': return a.length > 0;
      default: return false;
    }
  }

  // Marks after checking: «match» (green) or «look» (blue). No red.
  function gameBody(ex) {
    var a = S.ans, r = S.res;
    if (ex.type === 'pick' || ex.type === 'choice') {
      var opts = ex.opts || ex.choices.map(function (c) { return c[0]; });
      return '<div class="opts">' + S.ui.order.map(function (i) {
        var cls = a === i ? ' sel' : '';
        if (r && ex.type === 'pick') cls = i === ex.ok ? ' match' : a === i ? ' look' : ' dim';
        if (r && ex.type === 'choice') cls = a === i ? ' match' : ' plain';
        var pts = r && ex.type === 'choice' ? '<em>+' + ex.choices[i][1] + '</em>' : '';
        var note = r && ex.type === 'choice' ? '<small>' + esc(ex.choices[i][2]) + '</small>' : '';
        return '<button class="opt' + cls + '" data-opt="' + i + '" ' + (r ? 'disabled' : '') + '><span>' + esc(opts[i]) + note + '</span>' + pts + '</button>';
      }).join('') + '</div>';
    }
    if (ex.type === 'fill') {
      var slot = a === null ? '<span class="slot"></span>' : '<span class="slot full' + (r ? (r.ok ? ' match' : ' look') : '') + '">' + esc(ex.opts[a]) + '</span>';
      return '<p class="fill-s">' + esc(ex.before) + ' ' + slot + ' ' + esc(ex.after) + '</p>' + (r ? '' : '<div class="tiles">' + S.ui.order.map(function (i) {
        return '<button class="tile' + (a === i ? ' ghost' : '') + '" data-opt="' + i + '">' + esc(ex.opts[i]) + '</button>';
      }).join('') + '</div>');
    }
    if (ex.type === 'multi') {
      return '<div class="opts">' + S.ui.order.map(function (i) {
        var it = ex.items[i], on = !!a[i], cls = on ? ' sel' : '', tag = '';
        if (r) { var same = !!it[1] === on; cls = same ? (on ? ' match' : ' plain') : ' look'; tag = '<i class="tag ' + (same ? 'm' : 'l') + '">' + (same ? 'Coincide' : 'Para revisar') + '</i>'; }
        return '<button class="opt check' + cls + '" data-multi="' + i + '" ' + (r ? 'disabled' : '') + '><i class="box">' + (on ? IC.check : '') + '</i><span>' + esc(it[0]) + (r ? '<small>' + esc(it[2]) + '</small>' : '') + '</span>' + tag + '</button>';
      }).join('') + '</div>';
    }
    if (ex.type === 'build' || ex.type === 'order') {
      var isB = ex.type === 'build', words = isB ? E.tiles(ex) : ex.steps.map(function (st) { return st[0]; });
      var line = a.map(function (i, n) { return '<button class="tile ' + (isB ? '' : 'step') + '" data-out="' + n + '" ' + (r ? 'disabled' : '') + '>' + (isB ? '' : '<i>' + (n + 1) + '</i>') + esc(words[i]) + '</button>'; }).join('');
      var bank = S.ui.bank.map(function (i) {
        var used = a.indexOf(i) >= 0;
        return '<button class="tile ' + (isB ? '' : 'step') + (used ? ' ghost' : '') + '" data-in="' + i + '" ' + (used ? 'disabled' : '') + '>' + esc(words[i]) + '</button>';
      }).join('');
      return '<div class="answer-line ' + (isB ? '' : 'col') + (r ? (r.ok ? ' match' : ' look') : '') + '">' + (line || '<span class="hint">' + (isB ? 'Toca las palabras en orden' : 'Toca los pasos en orden') + '</span>') + '</div>' +
        (r ? '' : '<div class="tiles ' + (isB ? '' : 'col') + '">' + bank + '</div>');
    }
    if (ex.type === 'flag') {
      var w = RET.WHO[ex.msg.who];
      return '<div class="msgcard"><span class="mc-h"><i class="av" style="background:' + w[2] + '">' + esc(w[1]) + '</i><span><b>' + esc(w[0]) + '</b><small>' + esc(w[3]) + '</small></span></span><p class="mc-t flag-t">' +
        ex.parts.map(function (p, i) {
          var on = a.indexOf(i) >= 0, cls = on ? ' on' : '';
          if (r) cls = p[1] ? (on ? ' match' : ' missed') : (on ? ' extra' : '');
          return '<span class="seg' + cls + '" data-seg="' + i + '">' + esc(p[0]) + '</span>';
        }).join('') + '</p>' + (r ? '<small class="hint">Verde: lo encontraste. Amarillo: también era gancho.</small>' : '<small class="hint">Toca las partes que te parezcan gancho. Puedes marcar varias.</small>') + '</div>';
    }
    if (ex.type === 'swipe') {
      var k = S.ui.card, c = ex.cards[k], fl = S.ui.flash;
      var counter = '<p class="swipe-n">Tarjeta ' + Math.min(k + 1, ex.cards.length) + ' de ' + ex.cards.length + '</p>';
      var flash = fl ? '<div class="swipe-fb ' + (fl.ok ? 'match' : 'look') + '"><b>' + (fl.ok ? 'Coincide' : 'Otra mirada: ' + esc(fl.side)) + '</b><span>' + esc(fl.why) + '</span>' +
        (fl.ok ? '' : '<button class="btn small" data-act="swipe-next">Siguiente</button>') + '</div>' : '';
      if (!c || fl) return counter + flash;
      return counter + '<div class="swipe-stage"><div class="swipe-card" id="swipe-card"><span class="sw-l">' + esc(ex.left) + '</span><span class="sw-r">' + esc(ex.right) + '</span><p>' + esc(c[0]) + '</p></div></div>' +
        '<div class="swipe-btns"><button class="btn side l" data-side="L">‹ ' + esc(ex.left) + '</button><button class="btn side r" data-side="R">' + esc(ex.right) + ' ›</button></div>';
    }
    if (ex.type === 'pairs') {
      var col = function (side, order) {
        return '<div class="pcol">' + order.map(function (i) {
          var id = side + i, mt = S.ui.matched[i], sel = S.ui.sel === id, bad = S.ui.bad && S.ui.bad.indexOf(id) >= 0;
          return '<button class="ptile' + (mt ? ' matched' : '') + (sel ? ' sel' : '') + (bad ? ' nope' : '') + '" data-pair="' + id + '" ' + (mt ? 'disabled' : '') + '>' + esc(ex.pairs[i][side === 'L' ? 0 : 1]) + '</button>';
        }).join('') + '</div>';
      };
      return '<p class="hint">Toca una tarjeta de cada lado.</p><div class="pairs">' + col('L', S.ui.left) + col('R', S.ui.right) + '</div>';
    }
    if (ex.type === 'stop') {
      var w2 = RET.WHO[ex.who], shown = r ? ex.msgs.length : S.ui.shown, cut = r ? r.stopped : 0;
      var lines = ex.msgs.slice(0, shown).map(function (mm, i) {
        return (r && i === cut && cut < ex.msgs.length ? '<div class="stop-mark">Aquí dijiste «¡Alto!». Lo que sigue es lo que habría llegado.</div>' : '') +
          '<div class="sbub' + (r && i >= cut ? ' after' : '') + '">' + esc(mm[0]) + (r && mm[1] ? '<small>' + esc(mm[1]) + '</small>' : '') + '</div>';
      }).join('');
      return '<div class="msgcard stop"><span class="mc-h"><i class="av" style="background:' + w2[2] + '">' + esc(w2[1]) + '</i><span><b>' + esc(w2[0]) + '</b><small>' + esc(w2[3]) + '</small></span></span><div class="sthread" id="sthread">' + lines +
        (!r && shown < ex.msgs.length ? '<div class="sbub typing"><i></i><i></i><i></i></div>' : '') + '</div></div>' +
        (r ? '' : '<button class="btn alto" data-act="alto">¡Alto!</button>');
    }
    return '';
  }

  function resultHTML(ex, r) {
    var title, text = r.why || '', extra = '', good = r.ok;
    if (ex.type === 'swipe') { title = r.ok ? 'Coinciden todas' : r.right + ' de ' + r.of + ' coinciden'; text = r.ok ? 'Clasificaste cada tarjeta.' : 'En cada tarjeta viste por qué.'; good = true; }
    else if (ex.type === 'pairs') { title = 'Uniste todas las parejas'; text = ''; }
    else if (ex.type === 'stop') { title = r.stopped <= 3 ? 'Cortaste a tiempo' : 'Cortaste'; }
    else if (ex.type === 'choice') { title = 'Tu mensaje'; }
    else if (ex.type === 'multi') { title = r.ok ? 'Coincide' : 'Otra mirada'; text = r.ok ? 'Marcaste todo lo que te protege.' : 'Cada tarjeta dice por qué.'; }
    else if (ex.type === 'order') { title = r.ok ? 'Coincide' : 'Otra mirada'; extra = r.ok ? '' : '<p class="r-ans">' + esc(r.answer) + '</p>'; text = ex.steps.map(function (st) { return st[0] + ': ' + st[1]; }).join(' '); }
    else { title = r.ok ? 'Coincide' : 'Otra mirada'; if (!r.ok) extra = '<p class="r-ans"><b>La clave:</b> ' + esc(r.answer) + '</p>'; }
    var last = S.sess.pos >= S.sess.queue.length - 1;
    return '<div class="result ' + (good ? 'match' : 'look') + '"><div class="r-h">' + radi(good ? 'cheer' : 'think', 40) + '<b>' + esc(title) + '</b><span class="r-pts">+' + r.pts + '</span></div>' + extra + (text ? '<p>' + esc(text) + '</p>' : '') +
      '<button class="btn go" data-act="next">' + (last ? 'Ver cómo te fue' : 'Siguiente juego') + '</button></div>';
  }

  function doCheck() {
    if (S.res) return;
    S.res = E.check(S.sess, S.ans);
    beep(S.res.ok ? 'ok' : 'look');
    renderReto();
    var b = document.getElementById('sh-body');
    if (b) b.scrollTop = b.scrollHeight;
  }
  function nextGame() {
    if (E.advance(S.sess)) return finishReto();
    startGame(S.sess.pos);
  }

  function finishReto() {
    var sum = E.summary(S.sess), id = S.retoId, prev = store.done[id];
    store.pts += sum.pts;
    store.done[id] = { best: Math.max(sum.pts, prev ? prev.best : 0), times: (prev ? prev.times : 0) + 1 };
    S.newBadge = null;
    if (id !== E.REVIEW_ID) {
      var u = S.m.unit;
      if (!store.badges[u.id] && u.lessons.every(function (l) { return store.done[l.id]; })) { store.badges[u.id] = true; S.newBadge = u; }
    }
    save();
    S.sum = sum;
    S.step = 'fin';
    beep('done');
    renderReto();
  }

  function finHTML() {
    var sum = S.sum, m = S.m, nx = nextReto(), canNext = nx !== S.retoId && unlocked(nx) && S.retoId !== E.REVIEW_ID;
    return '<div class="fin">' + radi('cheer', 90) + '<h2>Reto completado</h2>' +
      '<div class="pts-box"><div class="pts-rows">' + sum.rows.map(function (r) { return '<span><em>' + esc(r[0]) + '</em><b>+' + r[1] + '</b></span>'; }).join('') + '</div><div class="pts-tot"><em>Total</em><b>' + IC.star + '+' + sum.pts + '</b></div></div>' +
      '<div class="take"><small>Para llevar</small><p>' + esc(m.takeaway) + '</p></div>' +
      (S.newBadge ? '<div class="new-badge"><span>' + esc(S.newBadge.letter) + '</span><div><small>Nueva insignia</small><b>' + esc(S.newBadge.badge) + '</b></div></div>' : '') +
      '</div><div class="sh-foot two">' + (canNext ? '<button class="btn go" data-act="next-reto">Siguiente reto</button>' : '') + '<button class="btn ghost" data-act="to-map">Volver al mapa</button></div>';
  }

  function bindReto() {
    var root = app();
    function on(sel, fn) { root.querySelectorAll(sel).forEach(function (b) { b.onclick = function (e) { fn(b, e); }; }); }
    var ex = typeof S.step === 'number' ? E.current(S.sess).ex : null;
    on('[data-act="to-ej"]', function () { beep('tap'); if (S.m.ej) { S.step = 'ej'; renderReto(); } else startGame(0); });
    on('[data-act="to-game"]', function () { beep('tap'); startGame(0); });
    on('[data-act="next"]', nextGame);
    on('[data-act="next-reto"]', function () { openReto(nextReto()); });
    on('[data-act="to-map"]', goMap);
    on('[data-act="check"]', doCheck);
    on('[data-act="transcript"]', function () { S.ui.transcript = !S.ui.transcript; renderReto(); });
    on('[data-act="play"]', function () { speak(ex.msg.text); });
    if (!ex || S.res) return;
    on('[data-opt]', function (b) { S.ans = +b.dataset.opt; beep('tap'); renderReto(); });
    on('[data-multi]', function (b) { var i = b.dataset.multi; S.ans[i] = !S.ans[i]; beep('tap'); renderReto(); });
    on('[data-in]', function (b) { S.ans.push(+b.dataset.in); beep('tap'); renderReto(); });
    on('[data-out]', function (b) { S.ans.splice(+b.dataset.out, 1); renderReto(); });
    on('[data-seg]', function (b) { var i = +b.dataset.seg, k = S.ans.indexOf(i); if (k >= 0) S.ans.splice(k, 1); else S.ans.push(i); beep('tap'); renderReto(); });
    on('[data-side]', function (b) { swipeDecide(ex, b.dataset.side); });
    on('[data-act="swipe-next"]', function () { S.ui.flash = null; swipeAfter(ex); });
    on('[data-pair]', function (b) { pairTap(ex, b.dataset.pair); });
    on('[data-act="alto"]', function () { S.ans.stopped = S.ui.shown; clearTimeout(S.ui.timer); doCheck(); });
    if (ex.type === 'swipe') bindDrag(ex);
    var th = document.getElementById('sthread');
    if (th) th.scrollTop = th.scrollHeight;
  }

  function speak(text) {
    try { var u = new SpeechSynthesisUtterance(text); u.lang = 'es-PE'; speechSynthesis.cancel(); speechSynthesis.speak(u); }
    catch (e) { S.ui.transcript = true; renderReto(); }
  }

  function swipeDecide(ex, side) {
    var c = ex.cards[S.ui.card], ok = c[1] === side;
    S.ans[S.ui.card] = side;
    S.ui.flash = { ok: ok, side: c[1] === 'L' ? ex.left : ex.right, why: c[2] };
    beep(ok ? 'ok' : 'look');
    var el = document.getElementById('swipe-card');
    if (el) el.classList.add(side === 'L' ? 'out-l' : 'out-r');
    setTimeout(function () {
      renderReto();
      if (ok) setTimeout(function () { if (S.ui.flash) { S.ui.flash = null; swipeAfter(ex); } }, ms(1100));
    }, ms(220));
  }
  function swipeAfter(ex) {
    S.ui.card += 1;
    if (S.ui.card >= ex.cards.length) { doCheck(); return; }
    renderReto();
  }
  function bindDrag(ex) {
    var el = document.getElementById('swipe-card');
    if (!el || S.ui.flash) return;
    var x0 = null, dx = 0;
    el.onpointerdown = function (e) { x0 = e.clientX; el.setPointerCapture(e.pointerId); el.classList.add('drag'); };
    el.onpointermove = function (e) {
      if (x0 === null) return;
      dx = e.clientX - x0;
      el.style.transform = 'translateX(' + dx + 'px) rotate(' + dx / 18 + 'deg)';
      el.classList.toggle('hint-l', dx < -40); el.classList.toggle('hint-r', dx > 40);
    };
    el.onpointerup = function () {
      el.classList.remove('drag');
      if (Math.abs(dx) > 90) swipeDecide(ex, dx < 0 ? 'L' : 'R');
      else { el.style.transform = ''; el.classList.remove('hint-l', 'hint-r'); }
      x0 = null; dx = 0;
    };
  }

  function pairTap(ex, id) {
    var ui = S.ui;
    if (!ui.sel || ui.sel[0] === id[0]) { ui.sel = ui.sel === id ? null : id; beep('tap'); renderReto(); return; }
    var a = ui.sel, b = id, li = +(a[0] === 'L' ? a : b).slice(1), ri = +(a[0] === 'R' ? a : b).slice(1);
    ui.sel = null;
    if (li === ri) {
      ui.matched[li] = true; beep('ok'); renderReto();
      if (Object.keys(ui.matched).length === ex.pairs.length) setTimeout(doCheck, ms(350));
    } else {
      S.ans.mistakes += 1; ui.bad = [a, b]; renderReto();
      setTimeout(function () { ui.bad = null; if (S.view === 'reto' && !S.res) renderReto(); }, ms(450));
    }
  }

  function runStop() {
    var ex = E.current(S.sess).ex;
    clearTimeout(S.ui.timer);
    S.ui.timer = setTimeout(function step() {
      if (S.view !== 'reto' || S.res || typeof S.step !== 'number') return;
      if (S.ui.shown >= ex.msgs.length) { doCheck(); return; }
      S.ui.shown += 1;
      renderReto();
      S.ui.timer = setTimeout(step, ms(S.ui.shown >= ex.msgs.length ? 2600 : 1900));
    }, ms(1900));
  }

  window.RETAPP = { state: S, store: store };
  render();
})();

</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js'); });
}
</script>
</body>
</html>
